<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - NezxAsia</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="auth-wrapper">
        <div class="auth-card">
            
            <div class="auth-header">
                <img src="images/logo.png" alt="NezxAsia Logo" style="height: 64px; width: auto; margin-bottom: 16px;">
                <h1>Sign Up</h1>
                <span class="muted">Create your new account</span>
            </div>

            <form action="login.html">
                
                <div class="form-row">
                    <label for="username">Username</label>
                    <input type="text" id="username" class="input" required>
                </div>

                <div class="form-row">
                    <label for="email">Email</label>
                    <input type="email" id="email" class="input" required>
                </div>

                <div class="form-row">
                    <label for="phone">Phone No</label>
                    <input type="tel" id="phone" class="input" required>
                </div>

                <div class="form-row">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="input" required>
                </div>

                <button type="submit" class="btn primary btn-full">Sign Up</button>
            </form>

            <div class="auth-links">
                <span>Already have an account? <a href="login.html">Login</a></span>
            </div>

        </div>
    </div>

</body>
</html>
