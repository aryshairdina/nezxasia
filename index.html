<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - NezxAsia</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="auth-wrapper">
        <div class="auth-card">
            
            <div class="auth-header">
                <img src="images/logo.png" alt="NezxAsia Logo" style="height: 64px; width: auto; margin-bottom: 16px; display: block; margin-left: auto; margin-right: auto;">
                
                <h1>NezxAsia Bank</h1>
                <span class="muted">Knowledge Capture & Learning</span>
            </div>

            <form action="dashboard.html">
                <div class="form-row">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="input" required>
                </div>

                <div class="form-row">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="input" required>
                </div>

                <button type="submit" class="btn primary btn-full">Log In</button>
            </form>

            <div class="auth-links">
                <a href="forgot-password.html">Forgot Password?</a>
                <a href="signup.html">Create Account</a>
            </div>

        </div>
    </div>

</body>
</html>
