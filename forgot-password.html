<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - NezxAsia</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="auth-wrapper">
        <div class="auth-card">
            
            <div class="auth-header">
                <img src="images/logo.png" alt="NezxAsia Logo" style="height: 64px; width: auto; margin-bottom: 16px;">
                
                <h1>Forgot Password</h1>
                <span class="muted">Enter your email to recover your account</span>
            </div>

            <form action="login.html">
                <div class="form-row">
                    <label for="email">Enter Email</label>
                    <input type="email" id="email" class="input" required>
                </div>

                <button type="submit" class="btn primary btn-full">Send Email</button>
            </form>

            <div class="auth-links">
                <a href="login.html">Back to Login</a>
            </div>

        </div>
    </div>

</body>
</html>
