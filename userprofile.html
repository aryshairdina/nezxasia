<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - NezxAsia</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="dashboard-container">
        
        <nav class="sidebar">
            <div class="brand">
                <img src="images/logo.png" alt="Logo" style="width: 32px; height: auto;">
                <span>NezxAsia</span>
            </div>
            
            <ul class="nav-links">
                <li><a href="dashboard.html" class="nav-item">Dashboard</a></li>
                <li><a href="#" class="nav-item active">My Profile</a></li>
                <li><a href="index.html" class="nav-item logout">Logout</a></li>
            </ul>
        </nav>

        <main class="main-content">
            
            <div class="page-header">
                <h2>Profile Settings</h2>
                <span class="muted">Manage your personal information</span>
            </div>

            <div class="profile-card">
                
                <div class="profile-header">
                    <div class="avatar-large">M</div> <div>
                        <h3 style="margin: 0; color: var(--primary);">Mohammad Aqeel</h3>
                        <span class="muted">Administrator</span>
                    </div>
                </div>

                <form>
                    <div class="form-row">
                        <label for="username">Username</label>
                        <input type="text" id="username" class="input" value="Aqeel_Zolkarnan">
                    </div>

                    <div class="form-row">
                        <label for="email">Email</label>
                        <input type="email" id="email" class="input" value="aqeel@nezxasia.com" disabled> 
                        </div>

                    <div class="form-row">
                        <label for="phone">Phone No</label>
                        <input type="tel" id="phone" class="input" value="012-3456789">
                    </div>

                    <div class="form-row">
                        <label for="password">New Password</label>
                        <input type="password" id="password" class="input">
                    </div>

                    <div class="form-row">
                        <label></label> <button type="submit" class="btn primary" style="width: auto; padding: 12px 24px;">Save Changes</button>
                    </div>
                </form>

            </div>

        </main>
    </div>

</body>
</html>
