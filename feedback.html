<!doctype html>
<html><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Feedback</title>
<link rel="stylesheet" href="styles.css">
</head><body>
<div class="container">
  <header class="topbar"><div class="brand">
    <div class="logo"><img src="images/logo.png" alt="NezxAsia Logo"></div>
    <div><strong>Feedback</strong>
      <div class="muted">Improve the KM portal</div>
    </div>
  </div>
</header>

  <div class="layout">
    <div id="sidebar-container"></div>
     <script>
  fetch('sidebar.html')
    .then(response => response.text())
    .then(data => {
      document.getElementById('sidebar-container').innerHTML = data;


      const currentPath = window.location.pathname.split("/").pop(); // Get filename (e.g. onboarding.html)
      const navLinks = document.querySelectorAll('.nav-item');

      navLinks.forEach(link => {

        if (link.getAttribute('href') === currentPath) {
          link.classList.add('active');
        }
      });
    })
    .catch(error => console.error('Error loading sidebar:', error));
</script>

    <main class="main">
      <div class="card form-grid">
        <div class="form-row"><label>Title</label><input class="input"></div>
        <div class="form-row"><label>Category</label><select class="input"><option>UI/UX</option><option>Content</option><option>Access</option></select></div>
        <div class="form-row" style="grid-column:1 / -1"><label>Message</label><textarea></textarea></div>
        <div class="form-row" style="grid-column:1 / -1;display:flex;justify-content:flex-end"><button class="btn primary" onclick="alert('Feedback submitted (UI)')">Send Feedback</button></div>
      </div>
    </main>
  </div>
</div>
</body></html>
